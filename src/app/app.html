<div class="app-ui flex h-dvh flex-col bg-stone-100 text-stone-900">
  <header
    class="app-header flex h-12 shrink-0 items-center gap-3 border-b border-stone-200 bg-white px-4"
  >
    <h1 class="app-logo text-base font-bold tracking-tight">
      printmd
      <span class="app-tagline ml-2 text-xs font-normal text-stone-500">Markdown を印刷用 PDF に</span>
    </h1>
    <p class="ml-2 text-xs text-stone-600" role="status" aria-live="polite">
      @if (store.phase() === 'rendering') {
        変換中…
      }
    </p>
    <button
      type="button"
      class="app-print-button ml-auto rounded-md bg-stone-800 px-3 py-1 text-xs font-medium text-white hover:bg-stone-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-800"
      (click)="print()"
    >
      印刷 (PDF に保存)
    </button>
  </header>

  <div class="flex min-h-0 flex-1 flex-col md:flex-row">
    <main class="relative min-h-0 flex-1 bg-stone-200" aria-label="印刷プレビュー">
      @if (store.hasFiles()) {
        <app-preview class="block h-full" />
      } @else {
        <div class="flex h-full items-center justify-center">
          <div class="max-w-sm text-center text-sm text-stone-600">
            <p class="text-3xl" aria-hidden="true">🖨️</p>
            <p class="mt-3">
              右のパネルから Markdown ファイルを取り込むと、ここに印刷プレビューが表示されます
            </p>
          </div>
        </div>
      }
    </main>

    <aside
      class="app-panel w-full shrink-0 overflow-y-auto border-t border-stone-200 bg-white p-4 md:w-90 md:border-l md:border-t-0"
      aria-label="調整パネル"
    >
      <app-file-panel />
      <app-break-panel />
    </aside>
  </div>
</div>

<!-- デザイン案の切り替え (チケット 22 の意思決定用。決定後に除去する) -->
<nav class="design-switcher" aria-label="デザイン案の切り替え">
  @for (option of designOptions; track option.id) {
    <a
      [href]="'?design=' + option.id"
      [class.active]="design() === option.id"
      [attr.aria-current]="design() === option.id ? 'true' : null"
      >{{ option.label }}</a
    >
  }
</nav>

<!-- 印刷対象。画面では非表示、@media print のみ可視化する (アプリ UI は同時に隠す) -->
<div class="print-root" #printRoot></div>
