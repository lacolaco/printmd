<div
  class="app-ui flex h-dvh flex-col"
  (dragover)="onWindowDragOver($event)"
  (drop)="onWindowDrop($event)"
>
  <header class="app-header flex h-12 shrink-0 items-center gap-3 border-b px-4">
    <h1 class="app-logo text-base font-bold tracking-tight">printmd</h1>
    @if (store.hasFiles()) {
      <div
        class="absolute left-1/2 flex -translate-x-1/2 items-center gap-2 text-xs text-stone-700"
        role="toolbar"
        aria-label="表示操作"
      >
        <span role="status" aria-live="polite">{{ statusLabel() }}</span>
        <span aria-hidden="true" class="opacity-40">|</span>
        <button
          type="button"
          class="rounded px-2 py-0.5 hover:bg-stone-200 disabled:opacity-30"
          [disabled]="viewer.zoomIndex() === 0"
          aria-label="縮小"
          (click)="viewer.setZoom(-1)"
        >
          −
        </button>
        <span class="w-10 text-center">{{ viewer.zoomLabel() }}</span>
        <button
          type="button"
          class="rounded px-2 py-0.5 hover:bg-stone-200 disabled:opacity-30"
          [disabled]="viewer.zoomIndex() === maxZoomIndex"
          aria-label="拡大"
          (click)="viewer.setZoom(1)"
        >
          ＋
        </button>
      </div>
    }
    <button type="button" class="app-print-button ml-auto rounded-sm px-3 py-1 text-xs font-medium" (click)="print()">
      印刷 (PDFに保存)
    </button>
  </header>

  @if (store.hasFiles()) {
    <div class="flex min-h-0 flex-1 flex-col md:flex-row">
      <main class="min-h-0 flex-1" aria-label="紙面プレビュー">
        <app-preview class="block h-full" />
      </main>
      <aside
        class="app-panel w-full shrink-0 overflow-y-auto border-t p-4 md:w-90 md:border-l md:border-t-0"
        aria-label="調整パネル"
      >
        <app-file-panel />
        <app-break-panel />
      <footer class="mt-6 border-t border-stone-200 pt-3 text-xs text-stone-500">
        <p>&copy; 2026 lacolaco</p>
        <p class="mt-1">
          <a class="underline hover:text-stone-800" href="https://github.com/lacolaco/printmd" rel="noopener">ソースコード</a>
          ・
          <a class="underline hover:text-stone-800" href="/3rdpartylicenses.txt" rel="noopener">サードパーティライセンス</a>
        </p>
      </footer>
      </aside>
    </div>
  } @else {
    <main class="relative min-h-0 flex-1" aria-label="原稿の取り込み">
      <label
        class="app-empty-drop flex h-full cursor-pointer flex-col items-center justify-center gap-3 text-sm"
        (dragover)="onWindowDragOver($event)"
        (drop)="onWindowDrop($event)"
      >
        <input
          type="file"
          class="sr-only"
          multiple
          accept=".md,.markdown,.txt"
          (change)="onFileInput($event)"
        />
        <span class="max-w-sm text-center">
          Markdownファイルをここへドロップ、またはクリックして選択すると、A4の紙面プレビューが表示されます
        </span>
        <span class="max-w-sm text-center text-xs opacity-60">
          チェックしたブロックの直前で改ページが入ります。原稿は書き換わりません
        </span>
      </label>
      <footer class="absolute bottom-3 left-0 right-0 text-center text-xs text-stone-500">
        &copy; 2026 lacolaco ・
        <a class="underline hover:text-stone-800" href="https://github.com/lacolaco/printmd" rel="noopener">ソースコード</a>
        ・
        <a class="underline hover:text-stone-800" href="/3rdpartylicenses.txt" rel="noopener">サードパーティライセンス</a>
      </footer>
    </main>
  }
</div>

<!-- 印刷対象。画面では非表示、@media print のみ可視化する (アプリ UI は同時に隠す) -->
<div class="print-root" #printRoot></div>
